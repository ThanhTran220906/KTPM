
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:8000;
    }

    upstream order_service {
        server order-service:8000;
    }

    upstream auth_service {
        server auth-service:8000;
    }

    limit_req_zone $binary_remote_addr
    zone=per_ip_limit:10m
    rate=10r/s;

    log_format gateway_log
        '$remote_addr - [$time_local] "$request" '
        '$status $body_bytes_sent '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time '
        'upstream_addr=$upstream_addr';

    access_log /var/log/nginx/access.log gateway_log;

    server {
        listen 8080;
        server_name _;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        # Phase 2: Cấp JWT qua Gateway
        location = /auth/token {
            proxy_pass http://auth_service/token;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        # Nginx gọi Auth Service để xác thực JWT
        location = /_auth {
            internal;
            proxy_pass http://auth_service/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        location = /users {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;

            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }

        location ^~ /users/ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;

            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }

        location = /orders {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;       
            
            auth_request /_auth;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
        }

        location ^~ /orders/ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;

            auth_request /_auth;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }
    }
}
