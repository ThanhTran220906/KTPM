worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:8000;
    }

    upstream order_service {
        server order-service:8000;
    }

    upstream auth_service {
        server auth-service:8000;
    }

    upstream gateway_api {
        server gateway-api:8000;
    }

    # Phase 3: shared per-IP rate limit across protected business endpoints.
    limit_req_zone $binary_remote_addr zone=per_ip_limit:10m rate=10r/s;

    log_format gateway_log
        '$remote_addr - [$time_local] "$request" '
        '$status $body_bytes_sent '
        'request_time=$request_time '
        'upstream_response_time=$upstream_response_time '
        'upstream_addr=$upstream_addr';

    access_log /var/log/nginx/access.log gateway_log;

    server {
        listen 8080;
        server_name _;

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = /auth/token {
            proxy_pass http://auth_service/token;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $content_type;
        }

        location = /_auth {
            internal;
            proxy_pass http://auth_service/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Phase 4 Aggregation route. Regex is checked before the generic /users/ prefix.
        location ~ ^/users/[0-9]+/summary$ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            auth_request /_auth;
            proxy_pass http://gateway_api;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location = /users {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # No ^~ here: the aggregation regex above must be able to match first.
        location /users/ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            auth_request /_auth;
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location = /orders {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            auth_request /_auth;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location ^~ /orders/ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            auth_request /_auth;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Issuing a Valet Key requires a normal login token.
        location ^~ /valet-keys/orders/ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            auth_request /_auth;
            proxy_pass http://gateway_api;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Reading with a Valet Key is authenticated by gateway-api itself,
        # because the token is intentionally not a normal login access token.
        location ^~ /valet/orders/ {
            limit_req zone=per_ip_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://gateway_api;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            default_type application/json;
            return 404 '{"detail":"Not Found"}';
        }
    }
}
