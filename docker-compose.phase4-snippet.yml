# Add this service under the existing top-level `services:` in docker-compose.yml.
# Do not replace your whole Compose file with this snippet.
  gateway-api:
    build:
      context: ./gateway-api
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      USER_SERVICE_URL: http://user-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      VALET_KEY_TTL_SECONDS: 300
    networks:
      - backend
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# Also add `gateway-api` to the existing gateway service's `depends_on:`
# alongside user-service, order-service and auth-service:
#   gateway-api:
#     condition: service_healthy
